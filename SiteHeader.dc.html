<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="{{ barStyle }}" data-screen-label="nav">
  <div style="max-width:2000px;margin:0 auto;height:72px;padding:0 clamp(20px,6vw,112px);display:flex;align-items:center;gap:16px">
    <a href="./Portfolio.dc.html" style="display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto;color:var(--ink);text-decoration:none">
      <span aria-hidden="true" style="flex:0 0 auto;width:28px;height:28px;border-radius:8px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;letter-spacing:-0.3px">RF</span>
      <span style="display:flex;align-items:baseline;gap:8px;min-width:0;overflow:hidden">
        <span style="font-size:15px;font-weight:600;letter-spacing:-0.125px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0">Rusna Mohamed Fasli</span>
        <sc-if value="{{ showRole }}" hint-placeholder-val="{{ true }}"><span style="font-size:14px;font-weight:400;color:var(--ink-muted);white-space:nowrap">UI/UX Portfolio</span></sc-if>
      </span>
    </a>
    <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
      <nav aria-label="Primary" style="display:flex;align-items:center;gap:clamp(4px,1.5vw,20px);margin-right:clamp(0px,1.5vw,16px)">
        <dc-import name="Button" variant="ghost" size="sm" label="Work" href="./Work.dc.html" active="{{ isWork }}" hint-size="64px,36px"></dc-import>
        <dc-import name="Button" variant="ghost" size="sm" label="About" href="./Profile.dc.html" active="{{ isAbout }}" hint-size="68px,36px"></dc-import>
      </nav>
      <dc-import name="Button" variant="utility" size="sm" label="Contact" href="./Contact.dc.html" hint-size="84px,36px"></dc-import>
    </sc-if>
    <dc-import name="Button" variant="icon" size="sm" icon="{{ themeIcon }}" ariaLabel="Toggle theme" onClick="{{ onToggleTheme }}" hint-size="36px,36px"></dc-import>
    <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
      <dc-import name="Button" variant="icon" size="sm" icon="{{ menuIcon }}" ariaLabel="Menu" onClick="{{ toggleMenu }}" hint-size="36px,36px"></dc-import>
    </sc-if>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <nav aria-label="Mobile" style="position:absolute;top:100%;left:0;right:0;border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline);box-shadow:var(--shadow-2);padding:8px clamp(20px,6vw,112px) 20px;display:flex;flex-direction:column;gap:2px;background:var(--surface)">
      <a href="./Work.dc.html" aria-current="{{ workCur }}" style="{{ workRow }}" style-active="background:var(--tint)">Work</a>
      <a href="./Profile.dc.html" aria-current="{{ aboutCur }}" style="{{ aboutRow }}" style-active="background:var(--tint)">About</a>
      <div style="height:10px"></div>
      <dc-import name="Button" variant="primary" label="Contact" href="./Contact.dc.html" block="{{ true }}" hint-size="100%,44px"></dc-import>
    </nav>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:64},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;work&quot;,&quot;about&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;isLight&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onToggleTheme&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { scrolled: false, vw: typeof window !== 'undefined' ? window.innerWidth : 1200, open: false };
  componentDidMount() {
    this.onScroll = () => { const s = window.scrollY > 4; if (s !== this.state.scrolled) this.setState({ scrolled: s }); };
    this.onResize = () => this.setState({ vw: window.innerWidth, open: window.innerWidth >= 860 ? false : this.state.open });
    window.addEventListener('scroll', this.onScroll, { passive: true });
    window.addEventListener('resize', this.onResize);
    this.onKey = (e) => { if (e.key === 'Escape' && this.state.open) this.setState({ open: false }); };
    window.addEventListener('keydown', this.onKey);
    this.onScroll();
  }
  componentWillUnmount() { window.removeEventListener('scroll', this.onScroll); window.removeEventListener('resize', this.onResize); window.removeEventListener('keydown', this.onKey); }
  renderVals() {
    const a = this.props.active ?? '';
    const light = this.props.isLight ?? true;
    const mobile = this.state.vw < 860;
    const rowStyle = (on) => ({ display: 'flex', alignItems: 'center', justifyContent: 'center', minHeight: 48, padding: '0 12px', margin: '0 -12px', borderRadius: 8, fontSize: 16, fontWeight: on ? 600 : 500, color: on ? 'var(--ink)' : 'var(--ink-2)', background: on ? 'var(--tint-2)' : 'transparent', textDecoration: 'none', WebkitTapHighlightColor: 'transparent' });
    return {
      barStyle: {
        position: 'relative',
        background: this.state.scrolled || this.state.open ? 'var(--surface)' : 'var(--bg)',
        borderBottom: '1px solid ' + (this.state.scrolled || this.state.open ? 'var(--hairline)' : 'transparent'),
        boxShadow: this.state.scrolled ? 'var(--shadow-1)' : 'none',
        transition: 'background-color 200ms ease, border-color 200ms ease, box-shadow 200ms ease'
      },
      desktop: !mobile, mobile, showRole: this.state.vw >= 1080,
      isWork: a === 'work', isAbout: a === 'about',
      themeIcon: light ? 'moon' : 'sun',
      menuIcon: this.state.open ? 'close' : 'menu',
      menuOpen: mobile && this.state.open,
      toggleMenu: () => this.setState({ open: !this.state.open }),
      onToggleTheme: this.props.onToggleTheme,
      workCur: a === 'work' ? 'page' : undefined, aboutCur: a === 'about' ? 'page' : undefined,
      workRow: rowStyle(a === 'work'), aboutRow: rowStyle(a === 'about')
    };
  }
}
</script>
</body>
</html>
